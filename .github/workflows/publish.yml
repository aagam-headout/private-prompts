# Publishes to npm with trusted publishing (OIDC) — no token lives in this repo
# or in CI secrets. npm mints a short-lived credential from the id-token below
# and verifies it came from this workflow, in this repository.
#
# One-time setup on npmjs.com, under the package's Settings → Trusted publisher:
#   Organization or user: aagam-headout
#   Repository:           prompt-vault
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1+ on Node 22.14+; the version bundled
      # with the runner image lags behind that.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # No --provenance flag: publishing this way from a public repository
      # attaches a provenance attestation on its own.
      - run: npm publish
