<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Prompt Vault</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23888%22 stroke=%22%23888%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%2211%22 width=%2218%22 height=%2211%22 rx=%222%22 ry=%222%22/><path d=%22M7 11V7a5 5 0 0 1 10 0v4%22 fill=%22none%22/></svg>" />
    <script>
      // shadcn's dark tokens hang off a `.dark` class. Resolve the theme before
      // first paint so the page never flashes the wrong one. A stored choice
      // wins; otherwise follow the OS and keep following it as it changes.
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var stored = null;
        try {
          stored = localStorage.getItem("pv-theme");
        } catch (err) {
          /* private mode — fall back to the OS preference */
        }
        var apply = function () {
          var choice = stored || "system";
          var dark = choice === "dark" || (choice === "system" && query.matches);
          document.documentElement.classList.toggle("dark", dark);
        };
        apply();
        query.addEventListener("change", apply);
        // App.jsx re-runs this after writing a new choice.
        window.__pvApplyTheme = function (next) {
          stored = next === "system" ? null : next;
          apply();
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
